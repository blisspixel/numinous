[package]
name = "numinous-gpu"
description = "Numinous GPU rendering: adaptive wgpu context and offscreen render, portable across GPUs and OSes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
gpu-post = []

[dependencies]
wgpu = "30.0.1"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
png = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "post_spike"
required-features = ["gpu-post"]

[lints]
workspace = true
