name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install Linux App libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Feature-gated GPU post and App presentation
        run: |
          cargo clippy -p numinous-gpu --all-features --all-targets -- -D warnings
          cargo test -p numinous-gpu --all-features --all-targets --locked
          cargo clippy -p numinous-app --all-features --all-targets -- -D warnings
          cargo test -p numinous-app --all-features --all-targets --locked
      - name: Documentation (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked
          cargo test --workspace --doc --locked
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: MCP drivers and Understanding study tests
        run: |
          python3 scripts/test-mcp-play.py
          python3 scripts/test-local-agent-playtest.py
          python3 scripts/test-agent-cohort.py
          python3 scripts/test-understanding-study.py
          python3 scripts/test-understanding-collect.py
      - name: Agent hallway, tactile, and first-contact cohorts
        run: |
          python3 scripts/agent-hallway.py
          python3 scripts/agent-tactile.py
          python3 scripts/agent-first-contact.py
      - name: Flagship visual and room-bed audio goldens
        run: |
          cargo build --locked --bin numinous
          python3 scripts/flagship-goldens.py
      - name: Creator roundtrip, soak, and catalog scorecard
        run: |
          python3 scripts/creator-roundtrip.py
          python3 scripts/test-creator-parity.py
          python3 scripts/creator-parity.py
          python3 scripts/test-reduced-motion.py
          python3 scripts/test-no-color.py
          python3 scripts/reduced-motion.py
          python3 scripts/no-color.py
          python3 scripts/test-gate-cli.py
          python3 scripts/test-run-exact-test.py
          python3 scripts/test-workflow-pins.py
          python3 scripts/test-ignored-tests-run-somewhere.py
          python3 scripts/test-am-soak.py
          python3 scripts/am-soak.py
          python3 scripts/catalog-scorecard.py
          python3 scripts/test-game-truth.py
          python3 scripts/game-truth.py
      - name: Understanding am-track dry-run auditors
        run: |
          python3 scripts/test-understanding-am.py
          python3 scripts/understanding-am-pipeline.py --check-only docs/evidence/understanding-0.4/registration-dry-run.json
      - name: Release and input contract tests
        run: |
          python3 scripts/test-package-release.py
          python3 scripts/test-agent-plugin.py
          python3 scripts/test-sensory-platform-proof.py
          python3 scripts/test-sensory-platform-set.py
          python3 scripts/test-release-engagement-smoke.py
          python3 scripts/test-uninstall-roundtrip.py
          python3 scripts/test-input-hardware-session.py
          python3 scripts/test-release-sbom.py
          python3 scripts/test-release-workflow.py
          python3 scripts/test-dependency-migration-performance.py
          python3 scripts/dependency-migration-performance.py --verify-receipt docs/evidence/dependency-migration-2026-08-02.json

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - name: Install Linux audio and input development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Minimum supported Rust check
        run: cargo +1.89.0 check --workspace --all-targets --locked

  house-style:
    name: house style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit-message check below reads this branch's own commits, so
          # it needs their messages rather than a single squashed tip.
          fetch-depth: 0
      - name: No emoji / dash / attribution
        run: bash scripts/check-style.sh
      - name: No emoji / dash / attribution in commit messages
        # The three hard rules cover commit messages as much as files, and a
        # message is the half that cannot be fixed by an ordinary edit later.
        # The commit-msg hook catches it before it is written; this catches it
        # for anyone who has not enabled the shared hooks path.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-commit-messages.sh "${BASE_SHA:-}"

  supply-chain:
    name: dependency review + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: moderate
          show-patched-versions: true
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Dual supply-chain path: deny owns licenses/bans/sources; audit owns the
  # RustSec advisory database with project-local ignores in .cargo/audit.toml.
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit
      - name: RustSec audit
        run: cargo audit

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
          # A Dependabot-authored squash can receive a read-only token on the
          # subsequent main push. Its pull request analysis already uploaded.
          upload: ${{ github.event_name != 'push' || github.event.head_commit.author.username != 'dependabot[bot]' }}

  coverage:
    name: coverage (>= 80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview
      - name: Install Linux audio and input development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov
      # The gpu and audio crates plus the app event loop are integration-tested on
      # real hardware and window/audio/GPU stacks, so those device surfaces are
      # excluded from the line-coverage gate.
      - name: Coverage gate
        run: cargo llvm-cov --workspace --fail-under-lines 80 --ignore-filename-regex '(crates[\\/](gpu|audio)[\\/]|faces[\\/]app[\\/]src[\\/]main\.rs)'

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Install Linux audio and input development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Feature App platform compile
        run: cargo check -p numinous-app --all-features --all-targets --locked
      - name: Linux direct App surface proof
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a cargo run --locked -p numinous-app --features gpu-post --example sensory_platform -- --out sensory-app-platform.json --check
      - name: Native direct App surface proof
        if: runner.os != 'Linux'
        run: cargo run --locked -p numinous-app --features gpu-post --example sensory_platform -- --out sensory-app-platform.json --check
      - name: Retain App surface proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensory-app-platform-${{ runner.os }}
          path: sensory-app-platform.json
          if-no-files-found: error
          retention-days: 14
      - name: Windows Python contract tests
        if: runner.os == 'Windows'
        run: |
          python scripts/test-mcp-play.py
          python scripts/test-local-agent-playtest.py
          python scripts/test-understanding-study.py
          python scripts/test-understanding-collect.py
          python scripts/test-input-hardware-session.py
          python scripts/test-release-sbom.py
          python scripts/test-release-workflow.py
          python scripts/test-dependency-migration-performance.py
          python scripts/dependency-migration-performance.py --verify-receipt docs/evidence/dependency-migration-2026-08-02.json
      - name: POSIX Python contract tests
        if: runner.os != 'Windows'
        run: |
          python3 scripts/test-mcp-play.py
          python3 scripts/test-local-agent-playtest.py
          python3 scripts/test-understanding-study.py
          python3 scripts/test-understanding-collect.py
          python3 scripts/test-input-hardware-session.py
          python3 scripts/test-release-sbom.py
          python3 scripts/test-release-workflow.py
          python3 scripts/test-dependency-migration-performance.py
          python3 scripts/dependency-migration-performance.py --verify-receipt docs/evidence/dependency-migration-2026-08-02.json
      - name: Windows installer safety
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -SelfTest
      - name: POSIX installer safety
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install.sh --self-test
      - name: Locked build
        run: cargo build --workspace --locked
      - name: Windows study parity
        if: runner.os == 'Windows'
        run: python scripts/study-parity.py --cli target/debug/numinous.exe --mcp target/debug/numinous-mcp.exe
      - name: POSIX study parity
        if: runner.os != 'Windows'
        run: python3 scripts/study-parity.py --cli target/debug/numinous --mcp target/debug/numinous-mcp
      - name: Render study reader plates
        run: cargo run --locked -p numinous-app --example study_screens
      - name: Retain study reader plates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-reader-${{ runner.os }}
          path: renders/study/
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: release artifacts
    uses: ./.github/workflows/release-packages.yml

  main-ci:
    name: main CI
    if: always()
    needs:
      - quality
      - msrv
      - house-style
      - supply-chain
      - audit
      - codeql
      - coverage
      - build
      - release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      MSRV_RESULT: ${{ needs.msrv.result }}
      HOUSE_STYLE_RESULT: ${{ needs.house-style.result }}
      SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
      AUDIT_RESULT: ${{ needs.audit.result }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      RELEASE_ARTIFACTS_RESULT: ${{ needs.release-artifacts.result }}
    steps:
      - name: Require every CI job
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$MSRV_RESULT" \
            "$HOUSE_STYLE_RESULT" \
            "$SUPPLY_CHAIN_RESULT" \
            "$AUDIT_RESULT" \
            "$CODEQL_RESULT" \
            "$COVERAGE_RESULT" \
            "$BUILD_RESULT" \
            "$RELEASE_ARTIFACTS_RESULT"
          do
            test "$result" = success
          done
