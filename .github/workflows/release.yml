name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-artifacts:
    name: package release artifacts
    uses: ./.github/workflows/release-packages.yml

  attest-artifacts:
    name: attest release provenance
    needs: package-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-set
          path: dist
      - id: attest-build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Stage provenance bundle
        shell: bash
        run: |
          bundle='${{ steps.attest-build.outputs.bundle-path }}'
          test -s "$bundle"
          cp -- "$bundle" "dist/numinous-${GITHUB_REF_NAME}-provenance.jsonl"
          test -s "dist/numinous-${GITHUB_REF_NAME}-provenance.jsonl"
      - id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          predicate-type: https://spdx.dev/Document
          predicate-path: dist/numinous-${{ github.ref_name }}-sbom.spdx.json
      - name: Stage SBOM attestation bundle
        shell: bash
        run: |
          bundle='${{ steps.attest-sbom.outputs.bundle-path }}'
          test -s "$bundle"
          cp -- "$bundle" "dist/numinous-${GITHUB_REF_NAME}-sbom-attestation.jsonl"
          test -s "dist/numinous-${GITHUB_REF_NAME}-sbom-attestation.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: |
            dist/*-provenance.jsonl
            dist/*-sbom-attestation.jsonl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [package-artifacts, attest-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-set
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: dist
      - name: Verify release evidence assets
        shell: bash
        run: |
          test -s "dist/numinous-${GITHUB_REF_NAME}-sbom.spdx.json"
          test -s "dist/numinous-${GITHUB_REF_NAME}-provenance.jsonl"
          test -s "dist/numinous-${GITHUB_REF_NAME}-sbom-attestation.jsonl"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "Numinous ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            "${prerelease[@]}"
