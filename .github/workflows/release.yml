name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    name: package release preview
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-packages.yml
    permissions:
      contents: read

  release-artifacts:
    name: build, audit, and attest release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-attest.yml
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

  publish:
    name: publish GitHub release
    needs: release-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-set
          path: dist
      - name: Verify release evidence assets
        shell: bash
        run: |
          test -s "dist/numinous-${GITHUB_REF_NAME}-sbom.spdx.json"
          test -s "dist/numinous-${GITHUB_REF_NAME}-provenance.jsonl"
          test -s "dist/numinous-${GITHUB_REF_NAME}-sbom-attestation.jsonl"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/package-release.py \
            --validate-remote-release-tag "${GITHUB_REF_NAME}" \
            --expected-sha "${GITHUB_SHA}" \
            --remote origin
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "Numinous ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            "${prerelease[@]}"
