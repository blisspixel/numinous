name: Nightly agent-and-machine QA

on:
  schedule:
    # 06:17 UTC daily; odd minute reduces thundering herds with other repos.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-am-${{ github.ref }}
  cancel-in-progress: true

jobs:
  am-qa:
    name: agent-and-machine soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Install Linux audio and input development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Build CLI and MCP faces
        run: cargo build --locked --bin numinous --bin numinous-mcp
      - name: Agent cohorts
        run: |
          python3 scripts/agent-hallway.py
          python3 scripts/agent-tactile.py
          python3 scripts/agent-first-contact.py
      - name: Flagship goldens
        run: python3 scripts/flagship-goldens.py
      - name: Creator roundtrip
        run: python3 scripts/creator-roundtrip.py

      - name: Creator parity across the CLI and MCP
        run: python3 scripts/creator-parity.py

      - name: Reduced motion (terminal face)
        run: |
          python3 scripts/test-reduced-motion.py
          python3 scripts/reduced-motion.py
      - name: NO_COLOR across every terminal surface
        run: |
          python3 scripts/test-no-color.py
          python3 scripts/no-color.py

      - name: Photosensitivity budget across the whole catalog (general and red flashes)
        # Run through the helper for the same reason as the step below: naming a
        # test that no longer exists makes cargo run nothing and exit 0, so a
        # rename would turn this gate into a no-op that reports success.
        run: |
          python3 scripts/run-exact-test.py \
            --package numinous-core --lib --ignored \
            registry::tests::no_catalog_room_flashes_past_the_photosensitivity_budget
      - name: Color independence across the catalog and all three faces
        # These also run on every pull request, in the required test job. They
        # are here because the nightly is where the accessibility evidence is
        # produced together, and because a drift in the committed audit should
        # be reported once a night rather than only when somebody happens to
        # touch a room.
        run: |
          python3 scripts/run-exact-test.py --package numinous-core --lib \
            raster::tests::color_independence_audit_matches_the_committed_evidence \
            raster::tests::every_room_the_audit_flags_is_tracked_somewhere \
            raster::tests::the_spectral_inks_stay_apart_for_a_color_blind_player_outside_the_known_list \
            raster::tests::a_mark_that_means_something_stays_apart_for_a_color_blind_player
          python3 scripts/run-exact-test.py --package numinous-app --lib \
            color_access::the_apps_own_marks_stay_apart_for_a_color_blind_player
          python3 scripts/run-exact-test.py --package numinous-mcp --bin numinous-mcp \
            tests::no_mcp_response_ever_carries_a_color_a_peer_might_not_see
      - name: Catalog visual contract across every room
        # This existed as an ignored test labelled a release matrix diagnostic
        # and was named by no workflow and no script, so it had never run
        # anywhere. It passes, so nothing had rotted, but an ignored test that
        # nothing names reads like a gate while checking nothing.
        run: |
          python3 scripts/run-exact-test.py \
            --package numinous-app --example screens --ignored \
            tests::catalog_visual_contract_report
      - name: Multi-room soak and catalog scorecard
        run: |
          python3 scripts/test-gate-cli.py
          python3 scripts/test-run-exact-test.py
          python3 scripts/test-workflow-pins.py
          python3 scripts/test-ignored-tests-run-somewhere.py
          python3 scripts/test-am-soak.py
          python3 scripts/am-soak.py
          python3 scripts/catalog-scorecard.py
      - name: Understanding am dry-run auditors
        run: |
          python3 scripts/test-understanding-am.py
          python3 scripts/understanding-am-pipeline.py --check-only docs/evidence/understanding-0.4/registration-dry-run.json

  roundtrip:
    # Its own job with a matrix, because 0.6-am asks for install, play and
    # uninstall on three operating systems and this ran only on Linux. The
    # roundtrip already chooses its installer by platform, PowerShell on
    # Windows and a shell script everywhere else, so what was missing was
    # somewhere for the other two to run rather than any code.
    name: install, play, uninstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing should not hide the others: this is per-platform
      # evidence, and a green Linux leg says nothing about Windows.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Install Linux audio and input development libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Judgment of the roundtrip gate itself
        shell: bash
        run: python3 scripts/test-uninstall-roundtrip.py
      - name: Install, play, uninstall against a freshly packaged archive
        # bash on every platform, including Windows, so there is one script
        # rather than three. The gate itself still reads the real platform and
        # runs that platform's installer.
        shell: bash
        run: |
          set -eu
          cargo build --release --locked --bin numinous --bin numinous-app --bin numinous-mcp
          python3 scripts/package-release.py \
            --target ${{ matrix.target }} --binary-dir target/release --output-dir dist
          version="$(python3 scripts/package-release.py --print-version)"
          payload="dist/numinous-v${version}-${{ matrix.target }}.${{ matrix.archive }}"
          test -f "$payload" || { echo "no archive at $payload"; ls -la dist; exit 1; }
          python3 scripts/uninstall-roundtrip.py \
            --release-archive "$payload" \
            --release-checksum "${payload}.sha256" \
            --release-tag "v${version}"
      - name: Every bundled track decodes to real audio
        # 0.6-am asks for all 42 tracks tested on each operating system. The
        # pull-request suite decodes the first track of each station, three of
        # forty-two, and checks the rest against a header duration that a
        # truncated or silent body still satisfies. Decoding all 42 takes about
        # three quarters of a minute in release, which is too slow for every
        # pull request and fine once a night, so the test is ignored by default
        # and named here. This job already runs on the three platforms.
        shell: bash
        run: |
          python3 scripts/run-exact-test.py \
            --package numinous-app --bin numinous-app --ignored \
            radio_cache::tests::every_bundled_track_decodes_to_real_audio
      - name: Keep the per-platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uninstall-roundtrip-${{ matrix.os }}
          path: .agent/tester-cohort/uninstall-roundtrip/summary.json
          if-no-files-found: warn
