# cargo-audit configuration. Mirrors the advisory policy in deny.toml so the
# two supply-chain gates agree. See docs/ENGINEERING.md.

[advisories]
# Keep empty unless a temporary, documented exception is required.
# Mirror any exception in deny.toml so the two gates agree.
ignore = [
    # ttf-parser unmaintained, reached only through cosmic-text 0.19 and
    # fontdb 0.23 on the three embedded Noto files. Exit: a cosmic-text
    # release that requires fontdb 0.24 or later, which dropped the crate.
    "RUSTSEC-2026-0192",
]
